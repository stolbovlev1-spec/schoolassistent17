<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#121225" />
  <meta name="description" content="Школьный Помощник — домашка, оценки, цели и расписание." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <title>Школьный Помощник</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Меню">☰</button>
      <div class="brand">
        <div class="brand-icon">▣</div>
        <div>
          <strong>Школьный Помощник</strong>
          <span>Твой помощник в учёбе</span>
        </div>
      </div>
      <button class="icon-btn" id="bellBtn" aria-label="Уведомления">♧</button>
    </header>

    <main id="screen" class="screen"></main>

    <nav class="bottom-nav" aria-label="Навигация">
      <button data-route="home" class="nav-item active"><span>⌂</span><small>Главная</small></button>
      <button data-route="homework" class="nav-item"><span>▤</span><small>ДЗ</small></button>
      <button data-route="grades" class="nav-item"><span>▱</span><small>Оценки</small></button>
      <button data-route="goals" class="nav-item"><span>◎</span><small>Цели</small></button>
      <button data-route="settings" class="nav-item"><span>⚙</span><small>Настройки</small></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <script src="app.js"></script><script src="register-sw.js"></script>
</body>
</html>
